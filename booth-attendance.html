<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>تسجيل حضور البوث</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0a0f1a;
    --card: #111827;
    --card-border: #1e293b;
    --accent: #10b981;
    --accent-glow: rgba(16, 185, 129, 0.15);
    --accent-soft: #065f46;
    --danger: #ef4444;
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --text-muted: #475569;
    --absent-bg: #1a1a2e;
    --present-bg: #052e16;
    --present-border: #166534;
    --signature-bg: #0f172a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0;
  }

  .header {
    background: linear-gradient(135deg, #064e3b 0%, #0a0f1a 100%);
    padding: 28px 20px 24px;
    text-align: center;
    border-bottom: 1px solid var(--card-border);
    position: relative;
    overflow: visible;
  }

  .menu-btn {
    position: absolute;
    top: 24px;
    left: 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    font-size: 22px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 10;
    font-family: 'Tajawal', sans-serif;
    letter-spacing: 1px;
  }

  .menu-btn:active {
    background: rgba(255,255,255,0.15);
  }

  .menu-dropdown {
    display: none;
    position: absolute;
    top: 68px;
    left: 16px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 6px;
    z-index: 20;
    min-width: 200px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    animation: fadeIn 0.15s ease;
  }

  .menu-dropdown.active {
    display: block;
  }

  .menu-dropdown button {
    display: block;
    width: 100%;
    padding: 12px 16px;
    background: none;
    border: none;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 14px;
    font-weight: 500;
    text-align: right;
    cursor: pointer;
    border-radius: 8px;
    transition: background 0.15s;
  }

  .menu-dropdown button:hover,
  .menu-dropdown button:active {
    background: rgba(255,255,255,0.06);
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(16,185,129,0.08) 0%, transparent 50%);
    pointer-events: none;
  }

  .header h1 {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .header p {
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 400;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 16px 20px;
    background: var(--card);
    border-bottom: 1px solid var(--card-border);
  }

  .stat {
    text-align: center;
  }

  .stat-num {
    font-size: 28px;
    font-weight: 800;
    line-height: 1;
  }

  .stat-num.green { color: var(--accent); }
  .stat-num.red { color: var(--danger); }
  .stat-num.white { color: var(--text); }

  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Department tab bar */
  .dept-tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--card-border);
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .dept-tabs::-webkit-scrollbar { display: none; }

  .dept-tab {
    flex-shrink: 0;
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text-dim);
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .dept-tab.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* Search bar */
  .search-bar {
    padding: 12px 16px 4px;
  }
  .search-input-field {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
  }
  .search-input-field:focus { border-color: var(--accent); }
  .search-input-field::placeholder { color: var(--text-muted); }

  .staff-list {
    padding: 12px 16px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .staff-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .staff-card:active {
    transform: scale(0.98);
  }

  .staff-card.present {
    background: var(--present-bg);
    border-color: var(--present-border);
    cursor: pointer;
  }

  .staff-card.present::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    background: var(--accent);
    border-radius: 0 4px 4px 0;
  }

  .staff-card.departed {
    background: #1a1200;
    border-color: #78350f;
    pointer-events: none;
    opacity: 0.85;
    cursor: default;
  }

  .staff-card.departed::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 4px;
    height: 100%;
    background: #f59e0b;
    border-radius: 0 4px 4px 0;
  }

  .staff-card.departed .avatar {
    background: linear-gradient(135deg, #78350f, #92400e);
  }

  .staff-card.departed .status-badge {
    background: rgba(245, 158, 11, 0.1);
    color: #fde68a;
    border: 1px solid rgba(245, 158, 11, 0.2);
  }

  .checkout-btn {
    display: inline-block;
    margin-top: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(245, 158, 11, 0.12);
    border: 1px solid rgba(245, 158, 11, 0.35);
    color: #fbbf24;
    font-size: 12px;
    font-weight: 600;
    pointer-events: none;
  }

  .no-session-msg {
    text-align: center;
    color: var(--text-muted);
    padding: 60px 20px;
    font-size: 18px;
  }

  .dept-header {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding: 14px 4px 6px;
    margin-top: 4px;
    border-bottom: 1px solid var(--card-border);
  }

  .staff-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: white;
    flex-shrink: 0;
  }

  .staff-card:not(.present) .avatar {
    background: linear-gradient(135deg, #1e293b, #334155);
  }

  .staff-card.present .avatar {
    background: linear-gradient(135deg, var(--accent), #059669);
  }

  .staff-name {
    font-size: 16px;
    font-weight: 700;
  }

  .staff-time {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status-badge {
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: 500;
  }

  .staff-card:not(.present) .status-badge {
    background: rgba(239, 68, 68, 0.1);
    color: #fca5a5;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  .staff-card.present .status-badge {
    background: rgba(16, 185, 129, 0.1);
    color: #6ee7b7;
    border: 1px solid rgba(16, 185, 129, 0.2);
  }

  /* Signature Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }

  .modal-overlay.active {
    display: flex;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal {
    background: var(--card);
    border-radius: 24px 24px 0 0;
    width: 100%;
    max-width: 500px;
    padding: 24px 20px max(32px, env(safe-area-inset-bottom));
    animation: slideUp 0.3s ease;
    border: 1px solid var(--card-border);
    border-bottom: none;
    max-height: 92vh;
    overflow-y: auto;
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--text-muted);
    border-radius: 4px;
    margin: 0 auto 20px;
  }

  .modal h2 {
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }

  .modal p {
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 20px;
  }

  .signature-area {
    background: var(--signature-bg);
    border: 2px dashed var(--card-border);
    border-radius: 16px;
    height: clamp(140px, 22vh, 200px);
    position: relative;
    margin-bottom: 16px;
    overflow: hidden;
    touch-action: none;
  }

  .signature-area canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .signature-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .signature-placeholder.hidden {
    opacity: 0;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-family: 'Tajawal', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-confirm {
    background: var(--accent);
    color: #fff;
  }

  .btn-confirm:disabled {
    background: #1e3a2f;
    color: #4a7c6a;
    cursor: not-allowed;
  }

  .btn-cancel {
    background: #1e293b;
    color: var(--text-dim);
  }

  .btn-clear {
    background: none;
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    padding: 8px 16px;
    border-radius: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 16px;
    display: block;
    margin-right: auto;
  }



  /* Toast */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--accent);
    color: white;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    z-index: 200;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  .sig-preview {
    width: 40px;
    height: 28px;
    border-radius: 6px;
    object-fit: contain;
    margin-right: 8px;
    background: var(--signature-bg);
    padding: 2px;
  }

  .hidden { display: none !important; }

  .loading-overlay {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 16px;
    font-weight: 500;
  }

  .error-message {
    text-align: center;
    padding: 40px 20px;
    color: var(--danger);
    font-size: 15px;
    font-weight: 500;
  }

  .fatal-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--danger);
    font-size: 15px;
    font-weight: 500;
    direction: rtl;
  }

  .no-event-msg {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 15px;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="header">
  <button class="menu-btn" onclick="toggleMenu(event)">⋮</button>
  <div class="menu-dropdown" id="menuDropdown">
    <button onclick="exportData(); toggleMenu(event);">📋 تصدير البيانات</button>

    <a href="dashboard.html" style="display:block;width:100%;padding:12px 16px;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:500;text-align:right;text-decoration:none;border-radius:8px;transition:background 0.15s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background=''">⚙️ لوحة التحكم</a>
  </div>
  <h1>تسجيل حضور البوث</h1>
  <p id="eventDate"></p>
</div>

<div class="stats-bar" id="statsBar">
  <div class="stat">
    <div class="stat-num white" id="totalCount">0</div>
    <div class="stat-label">الإجمالي</div>
  </div>
  <div class="stat">
    <div class="stat-num green" id="presentCount">0</div>
    <div class="stat-label">حاضر</div>
  </div>
  <div class="stat">
    <div class="stat-num" style="color:#fde68a" id="departedCount">0</div>
    <div class="stat-label">انصرف</div>
  </div>
  <div class="stat">
    <div class="stat-num red" id="absentCount">0</div>
    <div class="stat-label">غائب</div>
  </div>
</div>

<div class="dept-tabs" id="deptTabs"></div>

<div class="search-bar">
  <input class="search-input-field" id="staffSearch" type="text" placeholder="🔍 ابحث عن اسمك..." autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div class="staff-list" id="staffList">
  <div id="loadingOverlay" class="loading-overlay">جارٍ التحميل...</div>
</div>



<!-- Signature Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="modalName"></h2>
    <p id="modalSubtitle">وقّع هنا لتأكيد الحضور</p>
    <div class="signature-area" id="signatureArea">
      <canvas id="sigCanvas"></canvas>
      <div class="signature-placeholder" id="sigPlaceholder">✍️ ارسم توقيعك هنا</div>
    </div>
    <button class="btn-clear" onclick="clearSignature()">مسح التوقيع</button>
    <div class="modal-actions">
      <button class="btn btn-confirm" id="btnConfirm" disabled onclick="confirmAttendance()">تأكيد الحضور ✓</button>
      <button class="btn btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ===== Supabase client — initialized inside init() after config guard =====
  let _supabase = null;

  // ===== Today's date (YYYY-MM-DD) — used for day-scoped attendance =====
  const TODAY = new Date().toISOString().split('T')[0];

  // ===== State variables =====
  // STAFF and currentEvent are loaded from DB on init; attendance is hydrated from DB
  let STAFF = [];
  let currentEvent = null;
  let attendance = {};
  let currentStaffId = null;
  let currentAction = 'check-in'; // 'check-in' | 'check-out'
  let activeDept = 'all';
  let staffSearchQuery = '';
  let isDrawing = false;
  let hasDrawn = false;
  let canvas, ctx;

  // ===== Helper functions (T005, T006, T007) =====

  function showLoading(visible) {
    document.getElementById('loadingOverlay').classList.toggle('hidden', !visible);
  }

  function showError(message) {
    const list = document.getElementById('staffList');
    list.innerHTML = `<div class="error-message">${message}</div>`;
  }

  function showFatalError(message) {
    document.getElementById('staffList').innerHTML =
      `<div class="fatal-error">⚠️ ${message}</div>`;
    document.getElementById('statsBar').style.display = 'none';
  }

  // ===== Async init — loads staff, event, and attendance from DB (T010–T017, T021) =====
  async function init() {
    // T011: Config guard — must run before createClient to catch missing config.js
    if (typeof SUPABASE_URL === 'undefined' || typeof SUPABASE_ANON_KEY === 'undefined') {
      showFatalError('ملف الإعدادات مفقود. يرجى إنشاء ملف config.js');
      return;
    }

    // T004: Initialize client only after confirming credentials exist
    _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // T012: Show loading indicator
    showLoading(true);

    try {
      // Stage 1: Fetch staff + event in parallel (US1 + US2)
      const [staffResult, eventResult] = await Promise.all([
        _supabase.from('staff').select('id, name, department').eq('is_active', true).order('name'),
        _supabase.from('events').select('id, name, event_date, end_date').eq('is_active', true).maybeSingle()
      ]);

      // T013: Handle staff query result (US1)
      if (staffResult.error) {
        showError('تعذّر تحميل بيانات الموظفين — تحقق من الاتصال بالإنترنت');
        return;
      }
      STAFF = staffResult.data || [];

      // T014+T015: Handle event query result (US2)
      currentEvent = eventResult.data || null;
      const headerDate = document.getElementById('eventDate');
      if (currentEvent) {
        const eventStart = currentEvent.event_date;
        const eventEnd   = currentEvent.end_date || currentEvent.event_date;

        // Build date range label for header
        const fmtDate = iso => {
          const d = new Date(iso + 'T00:00:00');
          return d.toLocaleDateString('ar-SA', { month: 'long', day: 'numeric' });
        };
        const dateLabel = eventStart === eventEnd
          ? new Date(eventStart + 'T00:00:00').toLocaleDateString('ar-SA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
          : fmtDate(eventStart) + ' – ' + new Date(eventEnd + 'T00:00:00').toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' });
        headerDate.textContent = currentEvent.name + ' — ' + dateLabel;

        // Guard: if today is outside the event's date range, show a message and stop
        if (TODAY < eventStart || TODAY > eventEnd) {
          showLoading(false);
          document.getElementById('staffList').innerHTML =
            '<p class="no-session-msg">لا توجد جلسة مسجلة لهذا اليوم</p>';
          return;
        }
      } else {
        const now = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        headerDate.textContent = now.toLocaleDateString('ar-SA', options);
      }

      // Stage 2: Fetch existing attendance for today only (day-scoped)
      if (currentEvent) {
        const attResult = await _supabase
          .from('attendance')
          .select('staff_id, checked_in_at, signature_data, id, checked_out_at, exit_signature_data')
          .eq('event_id', currentEvent.id)
          .eq('attendance_date', TODAY);

        if (!attResult.error && attResult.data) {
          attResult.data.forEach(record => {
            const d = new Date(record.checked_in_at);
            const time = d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

            let checkoutTime = null, checkoutSignature = null, checkoutTimestamp = null;
            if (record.checked_out_at) {
              const dOut = new Date(record.checked_out_at);
              checkoutTime = dOut.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
              checkoutSignature = record.exit_signature_data;
              checkoutTimestamp = record.checked_out_at;
            }

            attendance[record.staff_id] = {
              time,
              signature: record.signature_data,
              timestamp: record.checked_in_at,
              recordId: record.id,
              checkoutTime,
              checkoutSignature,
              checkoutTimestamp
            };
          });
        }
      }

      // Stage 3: Render UI
      renderDeptTabs();
      renderStaff();
      updateStats();
      initCanvas();

      // Wire search input
      document.getElementById('staffSearch').addEventListener('input', e => {
        staffSearchQuery = e.target.value.trim();
        renderStaff();
      });

    } catch (e) {
      showError('حدث خطأ أثناء التحميل — حاول إعادة تحميل الصفحة');
    } finally {
      // T012: Hide loading indicator
      showLoading(false);
    }
  }

  function getInitials(name) {
    const parts = name.split(' ');
    return parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0][0];
  }

  const DEPT_ORDER = [
    'إدارة الانتماء',
    'إدارة التطوير التنظيمي',
    'إدارة التدريب',
    'إدارة العمليات',
    'إدارة التوظيف'
  ];

  function renderDeptTabs() {
    const bar = document.getElementById('deptTabs');
    bar.innerHTML = '';

    // "All" tab
    const allTab = document.createElement('button');
    allTab.className = 'dept-tab' + (activeDept === 'all' ? ' active' : '');
    allTab.textContent = 'الكل';
    allTab.onclick = () => { activeDept = 'all'; renderDeptTabs(); renderStaff(); };
    bar.appendChild(allTab);

    // One tab per department (only those that have staff)
    const depts = DEPT_ORDER.filter(d => STAFF.some(s => s.department === d));
    depts.forEach(dept => {
      const tab = document.createElement('button');
      tab.className = 'dept-tab' + (activeDept === dept ? ' active' : '');
      tab.textContent = dept;
      tab.onclick = () => { activeDept = dept; renderDeptTabs(); renderStaff(); };
      bar.appendChild(tab);
    });
  }

  function renderStaff() {
    const list = document.getElementById('staffList');
    list.innerHTML = '';

    if (!currentEvent) {
      const msg = document.createElement('div');
      msg.className = 'no-event-msg';
      msg.textContent = 'لا يوجد حدث نشط — يرجى التواصل مع المسؤول';
      list.appendChild(msg);
      return;
    }

    // Apply search + department filters
    const q = staffSearchQuery.trim();
    let visible = STAFF.filter(s => {
      const deptMatch = activeDept === 'all' || s.department === activeDept;
      const searchMatch = !q || s.name.includes(q);
      return deptMatch && searchMatch;
    });

    if (visible.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'no-event-msg';
      msg.textContent = q ? 'لا توجد نتائج للبحث' : 'لا يوجد موظفون في هذه الإدارة';
      list.appendChild(msg);
      return;
    }

    // Show dept headers only when viewing all departments without search
    const showHeaders = activeDept === 'all' && !q;

    if (showHeaders) {
      // Group by department
      const groups = {};
      DEPT_ORDER.forEach(d => { groups[d] = []; });
      visible.forEach(s => {
        const dept = s.department || 'أخرى';
        if (!groups[dept]) groups[dept] = [];
        groups[dept].push(s);
      });

      Object.entries(groups).forEach(([dept, members]) => {
        if (members.length === 0) return;
        const header = document.createElement('div');
        header.className = 'dept-header';
        header.textContent = dept;
        list.appendChild(header);
        members.forEach(s => appendStaffCard(list, s));
      });
    } else {
      // Flat list for tab view or search results
      visible.forEach(s => appendStaffCard(list, s));
    }
  }

  function appendStaffCard(list, s) {
    const record = attendance[s.id];
    const isPresent = !!record;
    const isDeparted = isPresent && !!record.checkoutTime;

    const card = document.createElement('div');
    if (isDeparted) {
      card.className = 'staff-card departed';
    } else if (isPresent) {
      card.className = 'staff-card present';
      card.onclick = () => openModal(s.id, 'check-out');
    } else {
      card.className = 'staff-card';
      card.onclick = () => openModal(s.id, 'check-in');
    }

    let sigImg = '';
    if (isDeparted && record.checkoutSignature) {
      sigImg = `<img class="sig-preview" src="${record.checkoutSignature}" alt="توقيع الخروج">`;
    } else if (isPresent && record.signature) {
      sigImg = `<img class="sig-preview" src="${record.signature}" alt="توقيع الدخول">`;
    }

    let badgeText, timeText, hintText;
    if (isDeparted) {
      badgeText = 'انصرف';
      timeText = `خرج ${record.checkoutTime}`;
      hintText = '';
    } else if (isPresent) {
      badgeText = 'حاضر';
      timeText = `✓ وصل ${record.time}`;
      hintText = '<div class="checkout-btn">اضغط لتسجيل انصرافك</div>';
    } else {
      badgeText = 'غائب';
      timeText = 'لم يسجل بعد';
      hintText = '';
    }

    card.innerHTML = `
      <div class="staff-info">
        <div class="avatar">${getInitials(s.name)}</div>
        <div>
          <div class="staff-name">${s.name}</div>
          <div class="staff-time">${timeText}</div>
          ${hintText}
        </div>
      </div>
      <div style="display:flex;align-items:center;">
        ${sigImg}
        <div class="status-badge">${badgeText}</div>
      </div>
    `;

    list.appendChild(card);
  }

  function updateStats() {
    const total = STAFF.length;
    let presentCount = 0, departedCount = 0;
    Object.values(attendance).forEach(r => {
      if (r.checkoutTime) departedCount++;
      else presentCount++;
    });
    document.getElementById('totalCount').textContent = total;
    document.getElementById('presentCount').textContent = presentCount;
    document.getElementById('departedCount').textContent = departedCount;
    document.getElementById('absentCount').textContent = total - presentCount - departedCount;
  }

  // Canvas / Signature
  function initCanvas() {
    canvas = document.getElementById('sigCanvas');
    ctx = canvas.getContext('2d');

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    canvas.addEventListener('touchmove', handleTouch, { passive: false });
    canvas.addEventListener('touchend', stopDraw);
  }

  function resizeCanvas() {
    const area = document.getElementById('signatureArea');
    const rect = area.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(rect.width  * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.scale(dpr, dpr);
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
  }

  function handleTouch(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    if (e.type === 'touchstart') {
      isDrawing = true;
      ctx.beginPath();
      ctx.moveTo(x, y);
      onFirstDraw();
    } else if (e.type === 'touchmove' && isDrawing) {
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }

  function startDraw(e) {
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    onFirstDraw();
  }

  function draw(e) {
    if (!isDrawing) return;
    const rect = canvas.getBoundingClientRect();
    ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
    ctx.stroke();
  }

  function stopDraw() {
    isDrawing = false;
  }

  function onFirstDraw() {
    if (!hasDrawn) {
      hasDrawn = true;
      document.getElementById('sigPlaceholder').classList.add('hidden');
      document.getElementById('btnConfirm').disabled = false;
    }
  }

  function clearSignature() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
    document.getElementById('sigPlaceholder').classList.remove('hidden');
    document.getElementById('btnConfirm').disabled = true;
  }

  // Modal
  function openModal(id, action) {
    currentStaffId = id;
    currentAction = action;
    const staff = STAFF.find(s => s.id === id);
    document.getElementById('modalName').textContent = staff.name;

    if (action === 'check-out') {
      document.getElementById('modalSubtitle').textContent = 'وقّع هنا لتأكيد الانصراف';
      document.getElementById('btnConfirm').textContent = 'تأكيد الانصراف ✓';
    } else {
      document.getElementById('modalSubtitle').textContent = 'وقّع هنا لتأكيد الحضور';
      document.getElementById('btnConfirm').textContent = 'تأكيد الحضور ✓';
    }

    document.getElementById('modalOverlay').classList.add('active');

    setTimeout(() => {
      resizeCanvas();
      clearSignature();
    }, 100);
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    currentStaffId = null;
    clearSignature();
  }

  // Async confirm — writes to DB first, updates UI only on success
  async function confirmAttendance() {
    if (!currentStaffId || !hasDrawn || !currentEvent) return;

    const sigData = canvas.toDataURL('image/png');
    document.getElementById('btnConfirm').disabled = true;

    const staff = STAFF.find(s => s.id === currentStaffId);

    if (currentAction === 'check-in') {
      const { data, error } = await _supabase
        .from('attendance')
        .insert({
          staff_id:        currentStaffId,
          event_id:        currentEvent.id,
          signature_data:  sigData,
          attendance_date: TODAY
        })
        .select('id, checked_in_at')
        .single();

      if (error) {
        document.getElementById('btnConfirm').disabled = false;
        showToast('❌ فشل تسجيل الحضور، حاول مرة أخرى');
        return;
      }

      const d = new Date(data.checked_in_at);
      const time = d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      attendance[currentStaffId] = {
        time,
        signature: sigData,
        timestamp: data.checked_in_at,
        recordId: data.id,
        checkoutTime: null,
        checkoutSignature: null,
        checkoutTimestamp: null
      };

      closeModal();
      renderStaff();
      updateStats();
      showToast(`✓ تم تسجيل حضور ${staff.name}`);

    } else if (currentAction === 'check-out') {
      const record = attendance[currentStaffId];
      if (!record || !record.recordId) {
        showToast('❌ لا يوجد سجل حضور لهذا الموظف');
        document.getElementById('btnConfirm').disabled = false;
        return;
      }

      const { data, error } = await _supabase
        .from('attendance')
        .update({
          checked_out_at: new Date().toISOString(),
          exit_signature_data: sigData
        })
        .eq('id', record.recordId)
        .select('checked_out_at')
        .single();

      if (error) {
        document.getElementById('btnConfirm').disabled = false;
        showToast('❌ فشل تسجيل الانصراف، حاول مرة أخرى');
        return;
      }

      const dOut = new Date(data.checked_out_at);
      const checkoutTime = dOut.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      attendance[currentStaffId] = {
        ...record,
        checkoutTime,
        checkoutSignature: sigData,
        checkoutTimestamp: data.checked_out_at
      };

      closeModal();
      renderStaff();
      updateStats();
      showToast(`✓ تم تسجيل انصراف ${staff.name}`);
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Menu
  function toggleMenu(e) {
    e.stopPropagation();
    document.getElementById('menuDropdown').classList.toggle('active');
  }

  document.addEventListener('click', function() {
    document.getElementById('menuDropdown').classList.remove('active');
  });

// Export — T022+T023 (US5): uses currentEvent name; guards against missing event
  function exportData() {
    // T023: Guard — no active event
    if (!currentEvent) {
      showToast('لا يوجد حدث نشط للتصدير');
      return;
    }
    const now = new Date();
    // T022: Use event name from DB in report title
    let text = `📋 تقرير حضور: ${currentEvent.name}\n`;
    text += `التاريخ: ${now.toLocaleDateString('ar-SA')}\n`;
    text += `═══════════════════════\n\n`;

    let presentCount = 0;

    STAFF.forEach(s => {
      const record = attendance[s.id];
      if (record) {
        presentCount++;
        if (record.checkoutTime) {
          text += `✅ ${s.name} — وصل ${record.time} | غادر ${record.checkoutTime}\n`;
        } else {
          text += `✅ ${s.name} — وصل ${record.time}\n`;
        }
      } else {
        text += `❌ ${s.name} — غائب\n`;
      }
    });

    text += `\n═══════════════════════\n`;
    text += `الحضور: ${presentCount} / ${STAFF.length}\n`;

    if (navigator.share) {
      navigator.share({ title: 'تقرير حضور البوث', text: text });
    } else {
      navigator.clipboard.writeText(text).then(() => {
        showToast('تم نسخ التقرير ✓');
      });
    }
  }

  // Close modal on overlay click
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // T010 (US1): Run async init after DOM is ready
  document.addEventListener('DOMContentLoaded', init);
</script>
